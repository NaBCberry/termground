name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支/PR 上再次推送时，取消仍在运行的旧任务
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 只读权限即可，PR 来自 fork 时也不会拿到写权限
permissions:
  contents: read

env:
  # zotero-plugin-scaffold 要求 Node.js >= 22.8.0
  NODE_VERSION: "24"

jobs:
  lint:
    name: Lint & Format（仅报告）
    runs-on: ubuntu-latest
    # ⚠️ 当前仓库中约有 10 个既有文件未按 Prettier 配置格式化（约 1480 行差异），
    # 因此这一关暂时只报告、不阻塞 CI。本地执行 `npm run lint:fix` 修好后，
    # 删除下面这行即可恢复为硬性门禁。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prettier --check . && eslint .
      - name: Run Prettier and ESLint
        run: |
          set -o pipefail
          npm run lint:check 2>&1 | tee lint.log

      - name: Write lint summary
        if: always()
        run: |
          {
            echo "### 代码检查（仅报告，不会让 CI 失败）"
            echo ""
            if [ -f lint.log ]; then
              echo '```text'
              head -n 20 lint.log
              echo '...'
              tail -n 40 lint.log
              echo '```'
            else
              echo "未生成 lint.log（依赖安装步骤可能已失败）。"
            fi
            echo ""
            echo "本地一键修复：\`npm run lint:fix\`"
          } >> "$GITHUB_STEP_SUMMARY"

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Node 24 原生支持直接执行 .ts，无需额外编译步骤
      - name: Run unit tests
        run: npm run test:unit

  build:
    name: Type-check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # 生产模式构建：打包 .xpi，并生成 update.json / update-beta.json
      - name: Build plugin
        run: npm run build

      - name: List build output
        run: ls -lh .scaffold/build

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v5
        with:
          name: termground-xpi
          path: |
            .scaffold/build/*.xpi
            .scaffold/build/update*.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: Integration Test（headless Zotero）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 脚手架在 CI 中自动开启 headless：安装 xvfb 并下载 Zotero beta
      - name: Run tests
        run: npm run test
